<!DOCTYPE html>
<html lang="uz" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shikoyatni Ko'rib Chiqish | EduTest</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-6">
  <div class="max-w-3xl mx-auto bg-white rounded-2xl border border-slate-200 p-8 shadow-xl space-y-6">
    <div class="flex justify-between items-center border-b pb-4 border-slate-100">
      <h1 class="text-2xl font-bold text-slate-900">Shikoyat Tafsilotlari</h1>
      <span class="px-3 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-semibold">Jarayonda</span>
    </div>
    
    <div class="space-y-4">
      <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
        <p class="text-xs text-slate-500">Yuboruvchi o'quvchi</p>
        <p class="font-semibold text-slate-900">Jasur Rahimov (9-A sinf)</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Mavzu / Savol ID</label>
        <p class="text-slate-800 font-medium">Matematika testidagi 12-savol xato tuzilgan</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Shikoyat Matni</label>
        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 text-slate-700 text-sm">
          Salom, 12-savolda berilgan javoblar orasida to'g'ri variant berilmagan. Iltimos, buni ko'rib chiqsangiz.
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">O'qituvchi Javobi</label>
        <textarea class="w-full rounded-xl border border-slate-300 bg-slate-50 p-3 text-sm focus:outline-none focus:border-blue-600 focus:bg-white" rows="4" placeholder="Javobingizni yozing..."></textarea>
      </div>
    </div>

    <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
      <a href="/teacher_complaints.html" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100 font-medium text-sm">Orqaga</a>
      <button class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm shadow-md">Javobni Yuborish</button>
    </div>
  </div>
</body>
</html>
