{% extends 'accounts/base.html' %}{% block content %}<form method="post" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4 max-w-xl mx-auto">{% csrf_token %}<h1 class="text-xl font-bold text-blue-600">Shikoyat / Apellyatsiya</h1>
<div class="p-3 bg-slate-50 rounded-xl text-sm italic border border-slate-200">"{{ complaint.reason }}"</div>
<textarea name="question_text" class="w-full border p-3 rounded-xl">{{ question.text }}</textarea><input name="question_points" value="{{ question.points }}" class="border p-3 rounded-xl w-full">
{% for o in question.options.all %}<div class="flex gap-2 items-center"><input type="checkbox" name="correct_option_ids" value="{{ o.id }}" {% if o.is_correct %}checked{% endif %} class="w-5 h-5 accent-blue-600"><input name="opt_text_{{ o.id }}" value="{{ o.text }}" class="border p-2.5 rounded-xl flex-1"></div>{% endfor %}
<div class="p-3 bg-blue-50 border border-blue-100 rounded-2xl"><label class="text-xs font-bold block mb-1 text-blue-900">➕ Qo'shimcha variant qo'shish:</label><input name="new_option_text" placeholder="Yangi variant matni" class="w-full border p-2.5 rounded-xl text-sm bg-white"></div>
<input name="correct_text_answers" value="{{ question.correct_text_answers }}" placeholder="Ochiq savol javoblari (vergul bilan)" class="w-full border p-3 rounded-xl text-sm">
<input name="teacher_comment" placeholder="Ustozning o'quvchiga izohi" class="w-full border p-3 rounded-xl text-sm">
<div class="flex gap-3"><button name="action" value="resolve" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-bold transition shadow-sm">Saqlash va Ballarni Hisoblash</button><button name="action" value="reject" class="bg-slate-600 hover:bg-slate-700 text-white px-5 py-2.5 rounded-xl font-bold transition shadow-sm">Rad etish</button></div></form>{% endblock %}
