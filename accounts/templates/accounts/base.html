<!DOCTYPE html>
<html lang="uz" class="light" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EduTest{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="/assets/logo4-BS7ymqtK.png">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans">
  <nav class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur-md mx-4 xl:mx-auto max-w-7xl mt-4 rounded-2xl px-6 py-3 flex justify-between items-center shadow-sm">
    <a href="/dashboard.html" class="flex items-center gap-3">
      <img src="/assets/logo4-BS7ymqtK.png" alt="EduTest" class="w-10 h-10 object-contain">
      <div>
        <h1 class="text-xl font-bold text-blue-600">EduTest</h1>
        <p class="text-xs text-slate-500">Online Test Platformasi</p>
      </div>
    </a>
    <div class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600">
      <a href="/dashboard.html" class="hover:text-blue-600 transition">Dashboard</a>
      <a href="/teacher_tests.html" class="hover:text-blue-600 transition">Testlar</a>
      <a href="/student_rankings.html" class="hover:text-blue-600 transition">Reyting</a>
      <a href="/students_list.html" class="hover:text-blue-600 transition">O'quvchilar</a>
      <a href="/teacher_complaints.html" class="hover:text-blue-600 transition">Shikoyatlar</a>
    </div>
    <div class="flex items-center gap-3">
      <a href="/profile.html" class="px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded-xl transition">Profil</a>
      <a href="/login.html" class="px-5 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-md transition">Chiqish</a>
    </div>
  </nav>

  <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-200 bg-white text-slate-500 py-6 text-center text-sm">
    <p>© 2026 EduTest. Barcha huquqlar himoyalangan.</p>
  </footer>
</body>
</html>
