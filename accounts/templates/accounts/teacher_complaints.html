{% extends 'accounts/base.html' %}{% block content %}
<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
<h1 class="text-2xl font-bold mb-4">Shikoyat va Takliflar</h1>
{% for c in complaints %}<div class="border border-slate-200 p-4 rounded-xl flex justify-between items-center mb-3"><span><b>{{ c.student.get_display_name|default:"Anonim" }}</b> [{{ c.status }}]: "{{ c.reason }}"</span><a href="{% url 'review_complaint' c.id %}" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">Ko'rib chiqish</a></div>{% empty %}<p class="text-slate-400 text-sm">Hozircha shikoyatlar yo'q.</p>{% endfor %}
</div>
{% endblock %}
