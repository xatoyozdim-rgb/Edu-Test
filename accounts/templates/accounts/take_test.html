<!DOCTYPE html>
<html lang="uz" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Yechish | EduTest</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <nav class="border-b border-slate-200 bg-white px-6 py-4 flex justify-between items-center shadow-sm">
    <span class="text-lg font-bold text-blue-600">EduTest · Test Sinov</span>
    <div class="px-4 py-1.5 rounded-full bg-blue-50 text-blue-700 font-semibold text-sm border border-blue-200">
      ⏱️ Vaqt: <span id="timer">44:59</span>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto w-full p-6 flex-grow">
    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-xl space-y-6">
      <div class="flex justify-between items-center border-b pb-4 border-slate-100">
        <span class="text-sm text-slate-500 font-medium">Savol 3 / 20</span>
        <span class="text-xs px-3 py-1 bg-sky-100 text-sky-800 rounded-full font-semibold">Matematika</span>
      </div>

      <h2 class="text-2xl font-bold text-slate-900">Tenglamaning ildizlarini toping: x² - 5x + 6 = 0</h2>

      <div class="space-y-3">
        <label class="flex items-center gap-4 p-4 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-500 hover:bg-blue-50/50 transition">
          <input type="radio" name="answer" value="A" class="w-4 h-4 text-blue-600">
          <span class="text-base text-slate-800">A) x = 1, x = 6</span>
        </label>
        <label class="flex items-center gap-4 p-4 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-500 hover:bg-blue-50/50 transition">
          <input type="radio" name="answer" value="B" class="w-4 h-4 text-blue-600">
          <span class="text-base text-slate-800">B) x = 2, x = 3</span>
        </label>
        <label class="flex items-center gap-4 p-4 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-500 hover:bg-blue-50/50 transition">
          <input type="radio" name="answer" value="C" class="w-4 h-4 text-blue-600">
          <span class="text-base text-slate-800">C) x = -2, x = -3</span>
        </label>
        <label class="flex items-center gap-4 p-4 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer hover:border-blue-500 hover:bg-blue-50/50 transition">
          <input type="radio" name="answer" value="D" class="w-4 h-4 text-blue-600">
          <span class="text-base text-slate-800">D) x = 0, x = 5</span>
        </label>
      </div>

      <div class="flex justify-between items-center pt-6 border-t border-slate-100">
        <button class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100 font-medium text-sm transition">Orqaga</button>
        <a href="/student_results.html" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm shadow-md transition">Keyingisi →</a>
      </div>
    </div>
  </main>
</body>
</html>
