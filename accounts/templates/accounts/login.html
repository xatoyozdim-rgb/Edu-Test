<!DOCTYPE html>
<html lang="uz" class="light" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish | EduTest</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="grid min-h-screen bg-slate-100 text-slate-900 lg:grid-cols-2">

  <!-- CHAP TARAFDAGI FON QISMI -->
  <aside class="hidden lg:flex flex-col justify-between p-10 relative overflow-hidden bg-gradient-to-br from-amber-600 to-amber-800 text-white border-r">
    <div class="absolute -left-20 -top-20 size-96 rounded-full bg-white/10 blur-3xl"></div>
    
    <div class="relative flex items-center gap-3">
      <img src="/assets/logo4-BS7ymqtK.png" alt="Logo" class="size-10 object-contain">
      <span class="text-xl font-semibold">EduTest</span>
    </div>

    <div class="relative max-w-md space-y-4">
      <h2 class="text-3xl font-bold">Bilimni sinash va o'lchash uchun zamonaviy platforma</h2>
      <p class="text-amber-100 text-sm">Testlarni tezkor yarating va natijalarni real vaqt rejimida kuzatib boring.</p>
    </div>

    <div class="relative text-xs text-amber-200">© 2026 EduTest</div>
  </aside>

  <!-- O'NG TARAFDAGI FORMA QISMI -->
  <main class="flex items-center justify-center p-6 sm:p-10">
    <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-xl">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold mb-2 text-slate-900">Tizimga kirish</h1>
        <p class="text-sm text-slate-500">Email va parolingizni kiriting</p>
      </div>

      <form class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-2 text-slate-700">Email</label>
          <input type="email" required class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-amber-600 focus:bg-white transition" placeholder="email@misol.uz">
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-medium text-slate-700">Parol</label>
            <a href="#" class="text-xs text-amber-600 hover:underline">Parolni unutdingizmi?</a>
          </div>
          <input type="password" required class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-amber-600 focus:bg-white transition" placeholder="••••••••">
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-amber-600 hover:bg-amber-700 font-semibold text-white transition shadow-md shadow-amber-600/20">
          Kirish
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-600">
        Hisobingiz yo'qmi? <a href="/register" class="text-amber-600 font-medium hover:underline">Ro'yxatdan o'tish</a>
      </p>
    </div>
  </main>

</body>
</html>
