<!DOCTYPE html>
<html lang="uz" class="light" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish | EduTest</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="grid min-h-screen bg-slate-50 text-slate-900 lg:grid-cols-2">
  <aside class="hidden lg:flex flex-col justify-between p-10 relative overflow-hidden bg-gradient-to-br from-blue-600 via-sky-600 to-blue-800 text-white border-r">
    <div class="absolute -right-20 -top-20 size-96 rounded-full bg-white/10 blur-3xl"></div>
    <div class="relative flex items-center gap-3">
      <img src="/assets/logo4-BS7ymqtK.png" alt="EduTest" class="size-10 object-contain">
      <span class="text-xl font-bold tracking-wide">EduTest</span>
    </div>
    <div class="relative max-w-md space-y-4">
      <h2 class="text-3xl font-bold leading-tight">Xush kelibsiz!</h2>
      <p class="text-sky-100 text-sm leading-relaxed">Profilingizga kirib, yaratgan testlaringiz va natijalaringizni kuzatib boring.</p>
    </div>
    <div class="relative text-xs text-sky-200">© 2026 EduTest</div>
  </aside>

  <main class="flex items-center justify-center p-6 sm:p-10">
    <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-xl">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold mb-2 text-slate-900">Tizimga kirish</h1>
        <p class="text-sm text-slate-500">Login va parolingizni kiriting</p>
      </div>
      <form action="{% url 'login' %}" method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium mb-2 text-slate-700">Login (Username)</label>
          <input type="text" name="username" required class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition" placeholder="Login...">
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-medium text-slate-700">Parol</label>
            <a href="#" class="text-xs text-blue-600 hover:underline">Parolni unutdingizmi?</a>
          </div>
          <input type="password" name="password" required class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white transition" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 font-semibold text-white transition shadow-lg shadow-blue-600/20">Kirish</button>
      </form>
      <div class="mt-4 text-center">
        <a href="{% url 'google_login' %}" class="inline-flex items-center justify-center gap-2 w-full py-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-medium hover:bg-slate-50 transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Google orqali kirish
        </a>
      </div>
      <p class="mt-6 text-center text-sm text-slate-600">
        Hisobingiz yo'qmi? <a href="{% url '/signup' %}" class="text-blue-600 font-medium hover:underline">Ro'yxatdan o'tish</a>
      </p>
    </div>
  </main>
</body>
</html>
