{% load static %}
<!DOCTYPE html>
<html lang="uz" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shikoyat Yuborish | EduTest</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <nav class="border-b border-slate-200 bg-white px-6 py-4 flex justify-between items-center shadow-sm">
    <a href="{% url 'dashboard' %}" class="flex items-center gap-3">
      <span class="text-2xl">🎓</span>
      <span class="text-xl font-bold text-blue-600">EduTest</span>
    </a>
    <a href="{% url 'student_results' %}" class="text-sm font-medium text-slate-700 hover:text-blue-600">← Natijalarim</a>
  </nav>

  <main class="max-w-2xl mx-auto w-full p-6 my-8 flex-grow space-y-6">

    {% if messages %}
      <div class="space-y-2">
        {% for message in messages %}
          <div class="p-3 rounded-xl {% if message.tags == 'error' %}bg-red-100 text-red-700 border-red-200{% else %}bg-emerald-100 text-emerald-700 border-emerald-200{% endif %} text-sm font-medium border">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
      <h1 class="text-2xl font-bold text-slate-900">Shikoyat Yuborish</h1>
      <p class="text-sm text-slate-500 mt-1">{{ attempt.test.title }}</p>
    </div>

    <form method="post" action="{% url 'file_complaint' attempt.id %}"
          class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">
          Qaysi savol bo'yicha? <span class="text-red-500">*</span>
        </label>
        <select name="question_id" required
                class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-blue-600 focus:bg-white">
          <option value="">-- Savol tanlang --</option>
          {% for q in questions %}
            <option value="{{ q.id }}">
              {{ q.order }}. {{ q.text|truncatechars:70 }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">
          Shikoyat sababi <span class="text-red-500">*</span>
        </label>
        <textarea name="reason" required rows="5"
                  class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:outline-none focus:border-blue-600 focus:bg-white"
                  placeholder="Muammoni batafsil yozing. Masalan: 12-savolda to'g'ri javob varianti noto'g'ri belgilangan..."></textarea>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <a href="{% url 'student_results' %}"
           class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100 font-medium text-sm">
          Bekor qilish
        </a>
        <button type="submit"
                class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm shadow-md">
          Shikoyatni Yuborish
        </button>
      </div>
    </form>

  </main>
</body>
</html>
